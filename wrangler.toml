name = "survival"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[vars]
# SITE_URL is optional: links use the address the site is visited at (works for dev previews too).
FROM_EMAIL = "Bugging In <downloads@YOURDOMAIN.com>"

[[d1_databases]]
binding = "DB"
database_name = "survival-db"
database_id = "85fdff49-9e48-47c8-a4f7-0b31c9fd628f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "survival-files"
